services:
  meercatch-manager-v2-web:
    image: node:22-alpine
    container_name: meercatch-manager-v2
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3023:3000"
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_SPECBRIDGE_API_URL=https://sb-api.aiatti.com
      - NEXT_PUBLIC_SPECBRIDGE_KEY=sk_hP961KPNRPrOpIaiuSxEgRb4HovKTH5ICoEos9H4S8A
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    networks:
      - ai-dev-network

networks:
  ai-dev-network:
    external: true
